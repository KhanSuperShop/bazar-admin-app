<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>খান সুপার শপ - POS কাউন্টার</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f0f2f5; color: #333; }
    .header {
      background-color: #2e7d32; color: white; padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .header h1 { font-size: 15px; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .sync-btn {
      background-color: #ff9800; color: white; border: none; padding: 6px 10px;
      border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap;
    }
    .admin-btn {
      background-color: #4caf50; color: white; text-decoration: none;
      padding: 6px 8px; border-radius: 5px; font-size: 12px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.3); white-space: nowrap;
    }
    .status-bar {
      background: #e8f5e9; color: #2e7d32; text-align: center; font-size: 12px;
      padding: 4px; font-weight: bold; border-bottom: 1px solid #c8e6c9;
    }
    .status-offline { background: #ffebee; color: #c62828; border-color: #ffcdd2; }
    .container { display: flex; gap: 12px; padding: 10px; max-width: 1400px; margin: 0 auto; }
    .product-section { flex: 2; background: white; padding: 12px; border-radius: 8px; }
    .search-bar-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-box { flex: 1; padding: 10px; border: 2px solid #2e7d32; border-radius: 6px; font-size: 14px; }
    .scan-btn {
      background-color: #1976d2; color: white; border: none; padding: 0 14px;
      border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    #reader-container {
      display: none; margin-bottom: 12px; border: 2px dashed #1976d2;
      border-radius: 8px; padding: 8px; text-align: center; background: #e3f2fd;
    }
    #reader { width: 100%; max-width: 320px; margin: 0 auto; }
    .close-scan-btn {
      margin-top: 8px; background: #d32f2f; color: white; border: none;
      padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
    }
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px; max-height: 60vh; overflow-y: auto;
    }
    .product-card {
      border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px 8px 8px 8px;
      text-align: center; background: #fff; position: relative; cursor: pointer;
    }
    .badge {
      position: absolute; top: 5px; left: 5px; background: #d32f2f;
      color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    }
    .product-title { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
    .product-code { font-size: 11px; color: #666; margin-bottom: 3px; }
    .product-price { font-size: 13px; color: #2e7d32; font-weight: bold; }
    .old-price { text-decoration: line-through; color: #888; font-size: 11px; margin-right: 4px; }
    .billing-section { flex: 1; background: white; padding: 12px; border-radius: 8px; height: fit-content; }
    .customer-info { display: flex; gap: 8px; margin-bottom: 10px; }
    .customer-info input { width: 50%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
    th { background-color: #f8f9fa; color: #2e7d32; padding: 8px 4px; text-align: left; border-bottom: 2px solid #e0e0e0; }
    td { padding: 6px 4px; border-bottom: 1px solid #eee; }
    .qty-btn { padding: 2px 7px; background: #eee; border: 1px solid #ccc; border-radius: 3px; font-weight: bold; cursor: pointer; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
    .summary-row input { width: 90px; padding: 5px; text-align: right; border: 1px solid #ccc; border-radius: 4px; }
    .total-row { font-size: 16px; font-weight: bold; color: #d32f2f; border-top: 1px dashed #ccc; padding-top: 8px; }
    .action-buttons { display: flex; gap: 10px; margin-top: 12px; }
    .btn-clear { flex: 1; background: #d32f2f; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-print { flex: 2; background: #2e7d32; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    @media (max-width: 768px) {
      .container { flex-direction: column; padding: 8px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 40vh; }
    }

    @media print {
      body * { visibility: hidden; }
      #receiptModal, #receiptModal * { visibility: visible; }
      #receiptModal { position: absolute; left: 0; top: 0; width: 100%; background: none !important; align-items: flex-start !important; }
      #receiptBox { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 380px !important; margin: 0 auto; }
      .no-print { display: none !important; }
    }
        /* থার্মাল প্রিন্টারের (58mm/80mm) জন্য পরিষ্কার কালো-সাদা স্টাইল */
    @media print {
      body.thermal-mode #receiptBox {
        max-width: 280px !important;
        padding: 4px !important;
        color: #000 !important;
        font-family: 'Courier New', monospace !important;
      }
      body.thermal-mode #receiptBox * {
        color: #000 !important;
        background: transparent !important;
        border-color: #000 !important;
      }
      body.thermal-mode #receiptBox img,
      body.thermal-mode #receiptBox canvas {
        filter: contrast(200%) grayscale(100%);
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛒 খান সুপার শপ - POS কাউন্টার</h1>
    <div class="header-actions">
      <button class="sync-btn" onclick="syncData()">🔄 সিঙ্ক (<span id="pendingCount">0</span>)</button>
      <a href="admin.html" class="admin-btn">📋 অ্যাডমিন</a>
    </div>
  </div>
  <div id="netStatus" class="status-bar">🟢 অনলাইন মোড সক্রিয়</div>

  <div class="container">
    <div class="product-section">
      <div class="search-bar-group">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 নাম বা বারকোড..." autofocus>
        <button class="scan-btn" onclick="startScanner()">📷 স্ক্যান</button>
        <button onclick="openQuickSale()" style="background:#6a1b9a; color:white; border:none; padding:0 12px; border-radius:6px; font-weight:bold; font-size:13px; cursor:pointer; white-space:nowrap;">⚡ Quick</button>
      </div>
      <div id="reader-container">
        <div id="reader"></div>
        <button class="close-scan-btn" onclick="stopScanner()">❌ বন্ধ করুন</button>
      </div>
      <div class="product-grid" id="product-list"></div>
    </div>

    <div class="billing-section">
      <div class="customer-info">
        <input type="text" id="customerName" value="সরাসরি ক্রেতা" placeholder="ক্রেতার নাম">
        <input type="tel" id="customerPhone" placeholder="মোবাইল নাম্বার">
      </div>
      <table>
        <thead><tr><th>পণ্য</th><th>দর</th><th>পরিমাণ</th><th>মোট</th></tr></thead>
        <tbody id="cart-items"></tbody>
      </table>
      <div class="summary-row"><span>উপ-মোট:</span><strong id="subtotal">৳0</strong></div>
      <div class="summary-row" style="color: #2e7d32;"><span>পণ্যের ছাড় (সাশ্রয়):</span><strong id="productDiscount">৳0</strong></div>
      <div class="summary-row"><span>ডিসকাউন্ট (৳):</span><input type="number" id="discountInput" value="0" oninput="updateBill()"></div>
      <div class="summary-row total-row"><span>সর্বমোট বিল:</span><span id="grandTotal">৳0</span></div>
      <div class="summary-row"><span>গ্রাহক দিয়েছেন (৳):</span><input type="number" id="paidInput" value="0" oninput="updateBill()"></div>
      <div class="summary-row"><span>ফেরত পাবেন:</span><strong id="changeAmount" style="color: #2e7d32;">৳0</strong></div>
      <div class="action-buttons">
        <button class="btn-clear" onclick="clearCart()">🗑️ মুছুন</button>
        <button class="btn-print" onclick="completeSale()">🖨️ বিল ও সেভ</button>
      </div>
    </div>
  </div>
  <!-- Quick Sale পপআপ বক্স -->
  <div id="quickSaleModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:998; justify-content:center; align-items:center;">
    <div style="background:white; padding:18px; border-radius:8px; width:90%; max-width:300px; text-align:center;">
      <h3 style="color:#6a1b9a; margin-bottom:10px;">⚡ Quick Sale (দ্রুত বিক্রি)</h3>
      <input type="number" id="quickPriceInput" placeholder="পণ্যের দাম লিখুন (৳)" style="width:100%; padding:10px; margin-bottom:10px; border:2px solid #6a1b9a; border-radius:5px; font-size:15px;">
      <input type="number" id="quickQtyInput" value="1" min="1" placeholder="পরিমাণ (Qty)" style="width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc; border-radius:5px; font-size:15px;">
      <div style="display:flex; gap:8px;">
        <button onclick="closeQuickSale()" style="flex:1; background:#d32f2f; color:white; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">বাতিল</button>
        <button onclick="addQuickItem()" style="flex:2; background:#2e7d32; color:white; border:none; padding:9px; border-radius:5px; font-weight:bold; cursor:pointer;">✅ বিলে যোগ করুন</button>
      </div>
    </div>
  </div>

  <div id="receiptModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; justify-content:center; align-items:center; overflow-y:auto; padding:10px;">
    <div id="receiptBox" style="background:white; padding:18px; border-radius:8px; width:100%; max-width:360px; font-family:sans-serif; color:#222;">
      <div id="receiptContent"></div>
      <div class="no-print" style="text-align:center; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
        <button onclick="window.print()" style="background:#1976d2; color:white; border:none; padding:8px 16px; border-radius:5px; font-weight:bold; cursor:pointer; margin-right:6px;">🖨️ প্রিন্ট</button>
       <button onclick="printThermal()" style="background:#212121; color:white; border:none; padding:8px 12px; border-radius:5px; font-weight:bold; cursor:pointer; margin-right:6px;">🧾 থার্মাল প্রিন্ট</button>
        <button onclick="closeReceipt()" style="background:#d32f2f; color:white; border:none; padding:8px 16px; border-radius:5px; font-weight:bold; cursor:pointer;">বন্ধ করুন</button>
      </div>
    </div>
  </div>
  <script>
        let quickItemCount = 0;
    const SUPABASE_URL = 'https://kuecacvhadqzywvkmauo.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_ijrPXf2ssOl-5usaMmSNgw_VNpkJkpI';

    let products = JSON.parse(localStorage.getItem('pos_products')) || [];
    let pendingSales = JSON.parse(localStorage.getItem('pos_pending_sales')) || [];
    let memoCounter = Number(localStorage.getItem('pos_memo_counter')) || 72;
    let cart = [];
    quickItemCount = 0;
    let html5QrCode;

    function updateNetworkStatus() {
      const bar = document.getElementById("netStatus");
      if (navigator.onLine) {
        bar.innerText = "🟢 অনলাইন মোড (রিফ্রেশ/সিঙ্ক করতে 🔄 বাটনে চাপুন)";
        bar.classList.remove("status-offline");
      } else {
        bar.innerText = "🔴 অফলাইন মোড (বিলগুলো মেমোরিতে সেভ থাকবে)";
        bar.classList.add("status-offline");
      }
      document.getElementById("pendingCount").innerText = pendingSales.length;
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

       async function syncData() {
      if (!navigator.onLine) return alert("ইন্টারনেট সংযোগ নেই!");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json'
      };

      try {
        // অফলাইনের পেন্ডিং অর্ডারগুলো সঠিক কলামের নামে পাঠানো
        if (pendingSales.length > 0) {
          const resOrder = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(pendingSales)
          });
          if (resOrder.ok) {
            pendingSales = [];
            localStorage.setItem('pos_pending_sales', JSON.stringify([]));
            alert("অফলাইনের সব অর্ডার সফলভাবে অনলাইনে সেভ হয়েছে!");
          } else {
            // পুরনো ভুল ফরম্যাটের ডাটা ক্লিয়ার করা
            pendingSales = [];
            localStorage.setItem('pos_pending_sales', JSON.stringify([]));
          }
        }

        const resProd = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.asc`, {
          method: 'GET',
          headers: headers
        });

        if (resProd.ok) {
          products = await resProd.json();
          localStorage.setItem('pos_products', JSON.stringify(products));
          renderProducts();
        }
      } catch (err) {
        alert("নেটওয়ার্ক সমস্যা: " + err.message);
      }
      updateNetworkStatus();
    }

    function renderProducts(filterText = "") {
      const list = document.getElementById("product-list");
      list.innerHTML = "";
      
      const filtered = products.filter(p => {
        const titleMatch = p.title && p.title.toLowerCase().includes(filterText.toLowerCase());
        const code = p.barcode ? p.barcode.toString() : p.id.toString();
        return titleMatch || code.includes(filterText);
      });

      filtered.forEach(p => {
        const price = Number(p.price) || 0;
        const oldPrice = Number(p.old_price) || 0;
        let discountBadge = "";
        if (oldPrice > price) {
          const percent = Math.round(((oldPrice - price) / oldPrice) * 100);
          discountBadge = `<span class="badge">🔥 ${percent}% ছাড়</span>`;
        }

        const oldPriceHtml = oldPrice > price ? `<span class="old-price">৳${oldPrice}</span>` : "";
        const imgTag = p.image_url ? `<img src="${p.image_url}" style="width:100%; height:70px; object-fit:cover; border-radius:4px; margin-bottom:5px;">` : "";
        const codeText = p.barcode ? p.barcode : p.id;

        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `${discountBadge}${imgTag}<div class="product-title">${p.title}</div><div class="product-code">কোড: ${codeText}</div><div class="product-price">${oldPriceHtml}৳${price}</div>`;
        card.onclick = () => addToCart(p.id);
        list.appendChild(card);
      });
    }

    function addToCart(productId) {
      const product = products.find(p => p.id == productId);
      if (!product) return;
      const price = Number(product.price) || 0;
      const oldPrice = Number(product.old_price) || price;
      const existing = cart.find(item => item.id == productId);
      if (existing) existing.qty += 1;
      else cart.push({ id: product.id, name: product.title, price: price, old_price: oldPrice, qty: 1 });
      renderCart();
    }

    function addByBarcode(code) {
      const cleanCode = code.trim();
      const product = products.find(p => (p.barcode && p.barcode.toString() === cleanCode) || (p.id.toString() === cleanCode));
      if (product) {
        addToCart(product.id);
        document.getElementById("searchInput").value = "";
        renderProducts();
      } else alert("এই কোডের পণ্য নেই: " + cleanCode);
    }

    document.getElementById("searchInput").addEventListener("keypress", function(e) { if (e.key === "Enter") addByBarcode(this.value); });
    document.getElementById("searchInput").addEventListener("input", function() { renderProducts(this.value); });

    function renderCart() {
      const tbody = document.getElementById("cart-items");
      tbody.innerHTML = "";
      cart.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>৳${item.price}</td>
          <td style="white-space:nowrap;">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <input type="number" value="${item.qty}" min="1" onchange="setQty(${index}, this.value)" style="width:48px; text-align:center; padding:2px; border:1px solid #ccc; border-radius:3px; font-weight:bold;">
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </td>
          <td>৳${item.price * item.qty}</td>
        `;
        tbody.appendChild(tr);
      });
      updateBill();
    }

    function changeQty(index, delta) {
      cart[index].qty = Number(cart[index].qty) + delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function setQty(index, val) {
      const num = Number(val);
      if (num <= 0 || isNaN(num)) cart.splice(index, 1);
      else cart[index].qty = num;
      renderCart();
    }

    function updateBill() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const prodSavings = cart.reduce((sum, item) => sum + Math.max(0, (item.old_price - item.price) * item.qty), 0);
      const discount = Number(document.getElementById("discountInput").value) || 0;
      const grandTotal = Math.max(0, subtotal - discount);
      const paid = Number(document.getElementById("paidInput").value) || 0;
      const change = Math.max(0, paid - grandTotal);

      document.getElementById("subtotal").innerText = "৳" + subtotal;
      document.getElementById("productDiscount").innerText = "৳" + prodSavings;
      document.getElementById("grandTotal").innerText = "৳" + grandTotal;
      document.getElementById("changeAmount").innerText = "৳" + change;
    }

    function clearCart() {
      cart = [];
      document.getElementById("discountInput").value = 0;
      document.getElementById("paidInput").value = 0;
      renderCart();
    }

    function openQuickSale() {
      document.getElementById("quickSaleModal").style.display = "flex";
      document.getElementById("quickPriceInput").value = "";
      document.getElementById("quickQtyInput").value = 1;
      setTimeout(() => document.getElementById("quickPriceInput").focus(), 100);
    }

    function closeQuickSale() {
      document.getElementById("quickSaleModal").style.display = "none";
    }

       function addQuickItem() {
      const price = Number(document.getElementById("quickPriceInput").value);
      const qty = Number(document.getElementById("quickQtyInput").value) || 1;
      if (!price || price <= 0) return alert("সঠিক দাম লিখুন!");

      const nextNum = cart.filter(item => item.isQuick).length + 1;
      cart.push({
        id: 'quick-' + Date.now(),
        name: 'Item ' + nextNum,
        price: price,
        old_price: price,
        qty: qty,
        isQuick: true
      });
      renderCart();
      closeQuickSale();
    }

    async function completeSale() {
      if (cart.length === 0) return alert("আগে পণ্যের কার্ডে ক্লিক করে অর্ডার যোগ করুন!");
      
      memoCounter += 1;
      localStorage.setItem('pos_memo_counter', memoCounter);

      const cName = document.getElementById("customerName").value || "সরাসরি ক্রেতা";
      const rawPhone = document.getElementById("customerPhone").value.trim();
      const phoneNum = rawPhone ? Number(rawPhone) : null;
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const discount = Number(document.getElementById("discountInput").value) || 0;
      const grandTotal = Math.max(0, subtotal - discount);
      const productSavings = cart.reduce((sum, item) => sum + Math.max(0, (item.old_price - item.price) * item.qty), 0);
      const totalSavings = productSavings + discount;

      const now = new Date();
      const dateTimeStr = now.toLocaleDateString('bn-BD') + ', ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      let rowsHtml = cart.map((item, idx) => `
        <tr>
          <td style="padding:5px 2px; border-bottom:1px solid #eee;">${idx + 1}. ${item.name}</td>
          <td style="padding:5px 2px; border-bottom:1px solid #eee; text-align:center;">${item.qty}</td>
          <td style="padding:5px 2px; border-bottom:1px solid #eee; text-align:right;">৳${item.price * item.qty}</td>
        </tr>
      `).join("");

      const discountRowHtml = discount > 0 ? `<div style="text-align:right; font-size:13px; color:#d32f2f; margin-top:3px;">বিশেষ ছাড় (Discount): -৳${discount}</div>` : "";
      const savingsBannerHtml = totalSavings > 0 ? `<div style="text-align:center; color:#2e7d32; font-weight:bold; font-size:12px; margin:12px 0; background:#e8f5e9; padding:6px; border-radius:4px;">💰 আপনি মোট ৳${totalSavings} টাকা ছাড় (সাশ্রয়) পেয়েছেন!</div>` : "";

      document.getElementById("receiptContent").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #2e7d32; padding-bottom:8px; margin-bottom:8px;">
          <div>
            <h2 style="color:#2e7d32; font-size:18px; margin:0;">খান সুপার শপ</h2>
            <div style="font-size:12px; font-weight:bold; color:#444; margin-top:2px;">POS ক্যাশ মেমো #${memoCounter}</div>
            <div style="font-size:10px; color:#666; margin-top:2px;">${dateTimeStr}</div>
          </div>
          <div style="text-align:center;">
            <div id="shopQrBox" style="border:1px solid #ddd; padding:2px; display:inline-block;"></div>
            <div style="font-size:8px; color:#555;">Khan Super Shop</div>
          </div>
        </div>
        <div style="font-size:12px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed #ccc;">
          <strong>গ্রাহক:</strong> ${cName} ${rawPhone ? '(' + rawPhone + ')' : ''}
        </div>
        <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:8px;">
          <thead>
            <tr style="border-bottom:1px solid #333; color:#000;">
              <th style="text-align:left; padding:4px 2px;">পণ্য</th>
              <th style="text-align:center; padding:4px 2px;">পরিমাণ</th>
              <th style="text-align:right; padding:4px 2px;">দাম</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div style="border-top:1px dashed #999; padding-top:6px;">
          <div style="text-align:right; font-size:13px; color:#444;">উপ-মোট (Subtotal): ৳${subtotal}</div>
          ${discountRowHtml}
          <div style="text-align:right; font-size:16px; font-weight:bold; color:#d32f2f; margin-top:4px;">সর্বমোট বিল: ৳${grandTotal} টাকা</div>
        ${savingsBannerHtml}
        <div style="text-align:center; margin-top:10px;">
          <div id="orderQrBox" style="display:inline-block;"></div>
          <div style="font-size:10px; color:#555; margin-top:2px;">অর্ডার যাচাই QR #${memoCounter}</div>
          <div style="font-size:12px; font-weight:bold; color:#2e7d32; margin-top:8px; border-top:1px dashed #ccc; padding-top:6px;">
            🙏 খান সুপার শপে কেনাকাটা করার জন্য ধন্যবাদ! আবার আসবেন।
          </div>
        </div>
        </div>
      `;

            if (window.QRCode) {
        const shopUrl = "https://khansupershop." + "github.io/bazar-admin-app/";
        new QRCode(document.getElementById("shopQrBox"), { text: shopUrl, width: 48, height: 48 });
        new QRCode(document.getElementById("orderQrBox"), { text: `Khan Super Shop | Memo #${memoCounter} | Total: Tk.${grandTotal}`, width: 65, height: 65 });
      }
      document.getElementById("receiptModal").style.display = "flex";

      const formattedItems = cart.map(item => ({
        title: item.name,
        price: item.price,
        quantity: item.qty
      }));

      const orderData = {
        customer_name: cName,
        phone_number: phoneNum,
        total_amount: grandTotal,
        items: formattedItems,
        delivery_address: "POS Counter",
        status: "Confirmed"
      };

      if (navigator.onLine) {
        const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
        const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, { method: 'POST', headers: headers, body: JSON.stringify([orderData]) });
        if (!res.ok) saveOfflineSale(orderData);
      } else saveOfflineSale(orderData);
      
      clearCart();
    }

    function closeReceipt() { document.getElementById("receiptModal").style.display = "none"; }
    function printThermal() {
      document.body.classList.add("thermal-mode");
      window.print();
      setTimeout(() => document.body.classList.remove("thermal-mode"), 500);
    }
    function saveOfflineSale(orderData) {
      pendingSales.push(orderData);
      localStorage.setItem('pos_pending_sales', JSON.stringify(pendingSales));
      updateNetworkStatus();
    }
        function startScanner() {
      document.getElementById("reader-container").style.display = "block";
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 150 } };
      
      html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
        addByBarcode(decodedText);
        stopScanner();
      }, () => {}).catch(() => {
        html5QrCode.start({ facingMode: "user" }, config, (decodedText) => {
          addByBarcode(decodedText);
          stopScanner();
        }, () => {}).catch(() => {
          alert("ক্যামেরা পাওয়া যায়নি বা ব্রাউজারে পারমিশন ব্লক করা আছে!");
          document.getElementById("reader-container").style.display = "none";
        });
      });
    }

    function stopScanner() {
      if (html5QrCode) html5QrCode.stop().then(() => { document.getElementById("reader-container").style.display = "none"; });
      else document.getElementById("reader-container").style.display = "none";
    }

    updateNetworkStatus();
    if (navigator.onLine) syncData();
    else renderProducts();
         // Global Barcode Listener (সার্চ বক্সের বাইরে ক্লিক থাকলেও স্ক্যানার ও কিবোর্ড কাজ করবে)
    let barcodeBuffer = "";
    let barcodeTimer = null;

    function bnToEnNumber(str) {
      const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      return str.replace(/[০-৯]/g, d => bn.indexOf(d));
    }

    document.addEventListener("keydown", function(e) {
      const tag = e.target.tagName.toLowerCase();
      if (tag === "input" || tag === "textarea") return;

      if (e.key === "Enter") {
        if (barcodeBuffer.length >= 1) {
          e.preventDefault();
          if (document.getElementById("receiptModal").style.display === "flex") {
            closeReceipt();
          }
          addByBarcode(bnToEnNumber(barcodeBuffer));
          barcodeBuffer = "";
        }
        return;
      }

      if (e.key.length === 1) {
        barcodeBuffer += e.key;
        clearTimeout(barcodeTimer);
        barcodeTimer = setTimeout(() => {
          barcodeBuffer = "";
        }, 800); // ৮০০ মিলিসেকেন্ড সময় দেওয়া হয়েছে যাতে হাতে টাইপ করলেও কাজ করে
      }
    });
  </script>
</body>
</html>
